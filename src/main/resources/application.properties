spring.application.name=nexus-roadmap

server.port=${PORT:8081}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/nexusroadmap}
spring.datasource.username=${DB_USERNAME:myuser}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5174}
